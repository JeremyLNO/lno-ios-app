name: TestFlight Release

# Auto-publishes every push to main to TestFlight. Requires 5 repo secrets
# (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID              — App Store Connect API Key ID
#   ASC_ISSUER_ID           — App Store Connect API Issuer ID
#   ASC_KEY_P8              — full contents of the AuthKey_<id>.p8 file
#   IOS_DEV_CERT_P12        — base64 of an exported "Apple Development" .p12
#   IOS_DEV_CERT_PASSWORD   — the password that .p12 was exported with
# The API key comes from App Store Connect → Users and Access → Integrations
# → App Store Connect API (NOT the OneSignal APNs key — different key, same
# portal family). `xcodebuild archive` with automatic signing always wants an
# "Apple Development" identity for the archive step itself (distribution
# signing happens later, during export/upload, driven by the API key) — so
# that's the cert that needs to be reusable. It's imported into a throwaway
# keychain every run so automatic signing always reuses the SAME cert
# instead of minting a brand new one each time — GitHub's runners are
# ephemeral (no persisted keychain across runs), and repeatedly creating
# fresh certs silently exhausts the account's certificate quota, at which
# point every future archive fails outright ("Choose a certificate to
# revoke").
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Archive & upload to TestFlight
    runs-on: xcode-27
    if: ${{ vars.SKIP_TESTFLIGHT != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest non-beta Xcode
        # Deux contraintes opposées :
        #  - le Xcode *par défaut* de l'image est plus vieux que ce qui est installé à côté,
        #    et App Store Connect refuse un SDK trop ancien ;
        #  - mais il refuse AUSSI, et sèchement, tout binaire construit avec une bêta :
        #    « Unsupported SDK or Xcode version […] you need to use the latest Release
        #    Candidates (RC) ». L'image xcode-27 ne livre que Xcode_27_beta_6 comme
        #    version la plus haute, donc « la plus récente » tombait pile dessus.
        # On prend donc la plus récente NON bêta, et on inventorie ce qui est installé
        # pour que le prochain échec se diagnostique en lisant le log.
        run: |
          set -euo pipefail
          all=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V || true)
          echo "Xcode installés sur le runner :"; echo "$all" | sed 's/^/  /'
          stable=$(echo "$all" | grep -vi beta | tail -1 || true)
          if [ -z "$stable" ]; then
            echo "::error::Aucun Xcode non-bêta sur cette image — App Store Connect refusera l'upload."
            exit 1
          fi
          echo "Retenu : $stable"
          sudo xcode-select -s "$stable"
          xcodebuild -version

      - name: Regenerate Xcode project
        run: python3 gen_pbxproj.py

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.IOS_DEV_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Archive (signed, automatic provisioning)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        # Build number = minutes écoulées depuis 2023-11-14. Strictement croissant, et
        # partagé avec les uploads manuels depuis le Mac, donc jamais de numéro plus bas
        # qu'un build déjà en ligne — ce que faisait l'ancien 35700+run_number après un
        # upload manuel. TestFlight trie par NUMÉRO, pas par date d'upload : un numéro plus
        # bas laisse les testeurs sur un build périmé présenté comme « le dernier ».
        #
        # ⚠️ Aucun commentaire `#` à l'intérieur de la commande ci-dessous : le shell coupe
        # la commande au premier `#`, et xcodebuild partait alors sans clé ASC ni numéro de
        # build — « No Accounts / No profiles were found », archive en échec depuis le 13/09.
        run: |
          BUILD_NUMBER=$(( ($(date +%s) - 1700000000) / 60 ))
          xcodebuild archive \
            -project LNO.xcodeproj \
            -scheme LNO \
            -configuration Release \
            -archivePath build/LNO.xcarchive \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Export & upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/LNO.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
