name: TestFlight Release

# Auto-publishes every push to main to TestFlight. Requires 3 repo secrets
# (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID       — App Store Connect API Key ID
#   ASC_ISSUER_ID    — App Store Connect API Issuer ID
#   ASC_KEY_P8       — full contents of the AuthKey_<id>.p8 file
# These come from App Store Connect → Users and Access → Integrations →
# App Store Connect API (NOT the OneSignal APNs key — different key, same portal
# family). See README for the full walkthrough.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Archive & upload to TestFlight
    runs-on: macos-15
    if: ${{ vars.SKIP_TESTFLIGHT != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest available Xcode
        # App Store Connect rejects uploads built with an SDK older than the
        # current-year iOS SDK — the runner image's *default* Xcode lags behind
        # what's actually installed side-by-side on it, so pick the newest one.
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Regenerate Xcode project
        run: python3 gen_pbxproj.py

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archive (signed, automatic provisioning)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project LNO.xcodeproj \
            -scheme LNO \
            -configuration Release \
            -archivePath build/LNO.xcarchive \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Export & upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/LNO.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
